name: Update Stock Data

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      sectors:
        description: '板块名称（逗号分隔，如：电子,医药生物，留空则全量）'
        required: false
        default: ''
  schedule:
    - cron: '0 10 * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install baostock akshare

      - name: Run engine
        run: |
          if [ -n "${{ github.event.inputs.sectors }}" ]; then
            python engine.py --sectors "${{ github.event.inputs.sectors }}"
          else
            python engine.py
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p data
          [ -f data/snapshot.json ] && git add data/snapshot.json
          [ -f data/name_cache.json ] && git add data/name_cache.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: update stock data $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
