name: Update Stock Data

permissions:
  contents: write   # 授予推送到仓库的写权限

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install baostock akshare

      - name: Run engine
        run: python engine.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p data
          [ -f data/snapshot.json ] && git add data/snapshot.json
          [ -f data/tech.json ] && git add data/tech.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: update stock data $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi

