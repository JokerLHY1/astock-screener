name: Update Stock Data

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      sectors:
        description: '板块名称（逗号分隔，如：电子,医药生物，留空则全量）'
        required: false
        default: ''
      codes:
        description: '指定股票代码（逗号分隔，如 sh.600000,sz.000001，留空则走板块/全量逻辑）'
        required: false
        default: ''
      mode:
        description: '更新模式（有codes或sectors时自动走对应逻辑，都为空的用此参数）'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - full
          - force-refresh-stale
      stale_days:
        description: '超期阈值(天)'
        required: false
        default: '7'
        type: string
  schedule:
    # 北京时间 10:00（UTC 02:00），周五收盘后，工作流内另设 TZ=Asia/Shanghai
    - cron: '0 2 * * 1-5'

env:
  TZ: Asia/Shanghai

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install baostock akshare

      - name: Run engine (指定代码更新)
        if: ${{ github.event.inputs.codes != '' }}
        run: |
          echo "🔄 指定代码更新模式"
          echo "📋 代码: ${{ github.event.inputs.codes }}"
          CODES=$(echo "${{ github.event.inputs.codes }}" | tr ',' ' ')
          python engine.py --codes $CODES

      - name: Run engine (板块更新)
        if: ${{ github.event.inputs.codes == '' && github.event.inputs.sectors != '' }}
        run: |
          echo "🏷️ 板块更新模式"
          echo "📂 板块: ${{ github.event.inputs.sectors }}"
          python engine.py --sectors "${{ github.event.inputs.sectors }}"

      - name: Run engine (每日增量/全量)
        if: ${{ github.event.inputs.codes == '' && github.event.inputs.sectors == '' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "⏰ 定时触发 → 每日增量更新"
            python engine.py --daily --stale-days 7
          elif [ "${{ github.event.inputs.mode }}" = "full" ]; then
            echo "🏗️ 手动触发 → 全量建库"
            python engine.py --mode full
          elif [ "${{ github.event.inputs.mode }}" = "force-refresh-stale" ]; then
            echo "🔧 手动触发 → 强制刷新超期"
            python engine.py --force-refresh-stale --stale-days ${{ github.event.inputs.stale_days }}
          else
            echo "📅 手动触发 → 每日增量更新"
            python engine.py --daily --stale-days ${{ github.event.inputs.stale_days }}
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p data
          # 只提交聚合结果/小缓存；单个K线缓存(data/history/)不入库避免仓库膨胀
          [ -f data/snapshot.json ] && git add data/snapshot.json
          [ -f data/name_cache.json ] && git add data/name_cache.json
          [ -f data/fund_cache.json ] && git add data/fund_cache.json
          [ -f data/failed_stocks.json ] && git add data/failed_stocks.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: update stock data $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
